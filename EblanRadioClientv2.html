<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<!-- Подключение шрифтов (исправлен синтаксис rel="preconnect") -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">

<style>
.vb-q7m,
.vb-q7m * { box-sizing: border-box; }
.vb-q7m input,
.vb-q7m textarea,
.vb-q7m select { font: inherit; }

.vb-q7m {
/* Создаем единую переменную шрифта */
--q7m-font: 'Syne', sans-serif;

--q7m-bg: #4d7c81;
--q7m-card: #ff6a3c;
--q7m-border: #ce5630;
--q7m-text: #ffffff;
--q7m-sub: #ffffff;
--q7m-muted: #ffffff;
--q7m-accent: #ce5630;
--q7m-accent-2: #ff6a3c;
--q7m-live: #a0eef7;
--q7m-warn: #f59e0b;

font-family: var(--q7m-font);
background: var(--q7m-bg);
color: var(--q7m-text);
padding: 48px 20px;
position: relative;
overflow: hidden;
}

.vb-q7m::before {
content: "";
position: absolute;
inset: 0;
background:
radial-gradient(ellipse at 25% 0%, rgba(185, 68, 29, 0.12), transparent 60%),
radial-gradient(ellipse at 75% 100%, rgba(217, 68, 10, 0.06), transparent 60%);
pointer-events: none;
z-index: 0;
}

.vb-q7m__container {
position: relative;
z-index: 1;
max-width: 460px;
margin: 0 auto;
display: flex;
flex-direction: column;
gap: 20px;
}

.vb-q7m__head {
display: flex;
align-items: center;
justify-content: space-between;
padding: 0 4px;
}

.vb-q7m__brand {
display: inline-flex;
align-items: center;
gap: 8px;
font-family: var(--q7m-font);
font-size: 12px;
font-weight: 700;
font-style: italic;
letter-spacing: 0.12em;
color: var(--q7m-text);
text-transform: uppercase;
}

.vb-q7m__brand-ic { color: var(--q7m-accent); }

.vb-q7m__signal {
display: inline-flex;
align-items: flex-end;
gap: 2px;
height: 14px;
}

.vb-q7m__signal span {
display: block;
width: 3px;
background: var(--q7m-muted);
border-radius: 1px;
transition: background 0.3s;
}
.vb-q7m__signal span:nth-child(1) { height: 30%; }
.vb-q7m__signal span:nth-child(2) { height: 55%; }
.vb-q7m__signal span:nth-child(3) { height: 80%; }
.vb-q7m__signal span:nth-child(4) { height: 100%; }

.vb-q7m[data-state="playing"] .vb-q7m__signal span {
background: var(--q7m-accent);
animation: q7m-sig 1.2s ease-in-out infinite;
}
.vb-q7m[data-state="playing"] .vb-q7m__signal span:nth-child(1) { animation-delay: 0s; }
.vb-q7m[data-state="playing"] .vb-q7m__signal span:nth-child(2) { animation-delay: 0.15s; }
.vb-q7m[data-state="playing"] .vb-q7m__signal span:nth-child(3) { animation-delay: 0.3s; }
.vb-q7m[data-state="playing"] .vb-q7m__signal span:nth-child(4) { animation-delay: 0.45s; }

@keyframes q7m-sig {
0%, 100% { opacity: 0.4; }
50% { opacity: 1; }
}

.vb-q7m__card {
background: var(--q7m-card);
border-radius: 24px;
padding: 24px;
border: 1px solid var(--q7m-border);
box-shadow:
0 24px 48px -16px rgba(0, 0, 0, 0.6),
0 1px 0 rgba(255, 255, 255, 0.04) inset;
}

.vb-q7m__cover {
position: relative;
width: 100%;
aspect-ratio: 1;
border-radius: 16px;
overflow: hidden;
margin-bottom: 20px;
background:
linear-gradient(135deg, #143029 0%, #0a1f1a 50%, #050d0b 100%);
box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
border: 1px solid rgba(255, 255, 255, 0.04);
}

.vb-q7m__cover-bg {
position: absolute;
inset: 0;
background:
radial-gradient(circle at 50% 50%, rgba(29, 185, 84, 0.28), transparent 70%),
repeating-linear-gradient(45deg, transparent, transparent 12px, rgba(255, 255, 255, 0.015) 12px, rgba(255, 255, 255, 0.015) 24px);
opacity: 0;
transition: opacity 0.5s;
}

.vb-q7m[data-state="playing"] .vb-q7m__cover-bg {
opacity: 1;
animation: q7m-bg 4s ease-in-out infinite;
}

@keyframes q7m-bg {
0%, 100% { transform: scale(1); }
50% { transform: scale(1.06); }
}

.vb-q7m__cover-eq {
position: absolute;
inset: 0;
display: flex;
align-items: center;
justify-content: center;
gap: 8px;
z-index: 1;
}

.vb-q7m__cover-eq span {
display: block;
width: 10px;
background: linear-gradient(180deg, var(--q7m-accent-2), var(--q7m-accent));
border-radius: 4px;
height: 12px;
box-shadow: 0 0 20px rgba(29, 185, 84, 0.3);
transition: height 0.25s;
}

.vb-q7m[data-state="playing"] .vb-q7m__cover-eq span {
animation: q7m-eq 1.1s ease-in-out infinite;
}
.vb-q7m[data-state="playing"] .vb-q7m__cover-eq span:nth-child(1) { animation-delay: 0s; }
.vb-q7m[data-state="playing"] .vb-q7m__cover-eq span:nth-child(2) { animation-delay: 0.15s; }
.vb-q7m[data-state="playing"] .vb-q7m__cover-eq span:nth-child(3) { animation-delay: 0.3s; }
.vb-q7m[data-state="playing"] .vb-q7m__cover-eq span:nth-child(4) { animation-delay: 0.45s; }

@keyframes q7m-eq {
0%, 100% { height: 14px; }
50% { height: 64px; }
}

.vb-q7m__cover-badge {
position: absolute;
top: 12px;
left: 12px;
display: inline-flex;
align-items: center;
gap: 6px;
padding: 5px 10px 5px 8px;
background: rgba(0, 0, 0, 0.55);
-webkit-backdrop-filter: blur(12px);
backdrop-filter: blur(12px);
border-radius: 999px;
font-size: 10px;
font-weight: 800;
font-style: italic;
letter-spacing: 0.18em;
color: var(--q7m-live);
z-index: 2;
font-family: var(--q7m-font);
}

.vb-q7m__cover-dot {
width: 7px;
height: 7px;
border-radius: 50%;
background: var(--q7m-live);
box-shadow: 0 0 8px var(--q7m-live);
animation: q7m-blink 1.4s ease-in-out infinite;
}

@keyframes q7m-blink {
0%, 100% { opacity: 1; }
50% { opacity: 0.3; }
}

.vb-q7m__info {
text-align: center;
margin-bottom: 18px;
}

.vb-q7m__eyebrow {
font-family: var(--q7m-font);
font-size: 11px;
text-transform: uppercase;
letter-spacing: 0.18em;
color: var(--q7m-sub);
margin: 0 0 8px;
font-weight: 700;
font-style: italic;
}

/* Наш основной заголовок */
.vb-q7m__title {
font-family: var(--q7m-font);
font-size: clamp(24px, 5vw, 32px);
font-weight: 800;
font-style: bold;
text-transform: uppercase;
margin: 0 0 6px;
line-height: 1.1;
letter-spacing: -0.01em;
color: var(--q7m-text);
text-wrap: balance;
}

.vb-q7m__sub {
font-family: var(--q7m-font);
font-size: 13px;
font-weight: 500;
color: var(--q7m-sub);
margin: 0;
line-height: 1.4;
}

.vb-q7m__bar {
position: relative;
height: 3px;
background: rgba(255, 255, 255, 0.08);
border-radius: 999px;
overflow: hidden;
margin-bottom: 18px;
}

.vb-q7m__bar-fill {
position: absolute;
top: 0;
bottom: 0;
width: 35%;
background: linear-gradient(90deg, transparent, var(--q7m-accent), transparent);
border-radius: 999px;
opacity: 0;
transition: opacity 0.3s;
}

.vb-q7m[data-state="playing"] .vb-q7m__bar-fill {
opacity: 1;
animation: q7m-bar 2.4s linear infinite;
}

@keyframes q7m-bar {
0% { transform: translateX(-100%); }
100% { transform: translateX(400%); }
}

.vb-q7m__controls {
display: grid;
grid-template-columns: 1fr auto 1fr;
align-items: center;
gap: 12px;
}

.vb-q7m__side {
display: flex;
align-items: center;
min-width: 0;
}
.vb-q7m__side--r {
justify-content: flex-end;
gap: 10px;
}

.vb-q7m__status {
display: inline-flex;
align-items: center;
gap: 6px;
font-size: 12px;
color: var(--q7m-sub);
font-weight: 500;
font-family: var(--q7m-font);
min-width: 0;
}
.vb-q7m__status-text {
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}

.vb-q7m__status-dot {
width: 6px;
height: 6px;
border-radius: 50%;
background: var(--q7m-muted);
flex-shrink: 0;
transition: background 0.2s, box-shadow 0.2s;
}

.vb-q7m[data-state="playing"] .vb-q7m__status-dot {
background: var(--q7m-accent);
box-shadow: 0 0 6px var(--q7m-accent);
}
.vb-q7m[data-state="playing"] .vb-q7m__status { color: var(--q7m-text); }
.vb-q7m[data-state="loading"] .vb-q7m__status-dot {
background: var(--q7m-warn);
animation: q7m-blink 1s ease-in-out infinite;
}
.vb-q7m[data-state="loading"] .vb-q7m__status { color: var(--q7m-text); }
.vb-q7m[data-state="error"] .vb-q7m__status-dot { background: var(--q7m-live); }
.vb-q7m[data-state="error"] .vb-q7m__status { color: var(--q7m-live); }
.vb-q7m[data-state="paused"] .vb-q7m__status-dot { background: var(--q7m-sub); }

.vb-q7m__play {
width: 60px;
height: 60px;
border-radius: 50%;
border: none;
background: var(--q7m-text);
color: #000;
display: inline-flex;
align-items: center;
justify-content: center;
cursor: pointer;
transition: transform 0.15s ease, background 0.2s, box-shadow 0.2s;
position: relative;
flex-shrink: 0;
box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
padding: 0;
}

.vb-q7m__play:hover {
transform: scale(1.06);
background: #f5f5f5;
box-shadow: 0 12px 28px rgba(0, 0, 0, 0.4);
}
.vb-q7m__play:active { transform: scale(0.95); }
.vb-q7m__play:focus-visible {
outline: 2px solid var(--q7m-accent);
outline-offset: 4px;
}

.vb-q7m__i-play,
.vb-q7m__i-pause {
width: 22px;
height: 22px;
fill: currentColor;
display: block;
}
.vb-q7m__i-play { margin-left: 2px; }
.vb-q7m__i-pause { display: none; }

.vb-q7m[data-state="playing"] .vb-q7m__i-play { display: none; }
.vb-q7m[data-state="playing"] .vb-q7m__i-pause { display: block; margin: 0; }

.vb-q7m__spin {
position: absolute;
inset: -4px;
border-radius: 50%;
border: 2.5px solid transparent;
border-top-color: var(--q7m-accent);
border-right-color: var(--q7m-accent);
opacity: 0;
pointer-events: none;
}

.vb-q7m[data-state="loading"] .vb-q7m__spin {
opacity: 1;
animation: q7m-spin 0.9s linear infinite;
}

@keyframes q7m-spin {
to { transform: rotate(360deg); }
}

.vb-q7m__iconbtn {
width: 36px;
height: 36px;
border-radius: 50%;
border: none;
background: transparent;
color: var(--q7m-sub);
display: inline-flex;
align-items: center;
justify-content: center;
cursor: pointer;
transition: color 0.2s, background 0.2s, transform 0.1s;
flex-shrink: 0;
padding: 0;
}
.vb-q7m__iconbtn:hover {
color: var(--q7m-text);
background: rgba(255, 255, 255, 0.08);
}
.vb-q7m__iconbtn:active { transform: scale(0.92); }
.vb-q7m__iconbtn:focus-visible {
outline: 2px solid var(--q7m-accent);
outline-offset: 2px;
}
.vb-q7m__iconbtn svg {
width: 18px;
height: 18px;
display: block;
}
.vb-q7m__i-vol-on,
.vb-q7m__i-vol-off { fill: currentColor; }
.vb-q7m__i-vol-off { display: none; }
.vb-q7m[data-volume="0"] .vb-q7m__i-vol-on { display: none; }
.vb-q7m[data-volume="0"] .vb-q7m__i-vol-off { display: block; }

.vb-q7m__vol {
position: relative;
width: 100px;
height: 16px;
display: flex;
align-items: center;
cursor: pointer;
}

.vb-q7m__vol-track {
position: relative;
width: 100%;
height: 4px;
background: rgba(255, 255, 255, 0.1);
border-radius: 2px;
}

.vb-q7m__vol-fill {
position: absolute;
top: 0;
bottom: 0;
left: 0;
background: var(--q7m-text);
border-radius: 2px;
width: 75%;
pointer-events: none;
transition: background 0.2s;
}

.vb-q7m__vol:hover .vb-q7m__vol-fill { background: var(--q7m-accent); }

.vb-q7m__vol-input {
position: absolute;
inset: 0;
width: 100%;
height: 100%;
opacity: 0;
cursor: pointer;
margin: 0;
padding: 0;
}

.vb-q7m__meta {
font-family: var(--q7m-font);
text-align: center;
font-size: 12px;
color: var(--q7m-muted);
margin: 0;
letter-spacing: 0.02em;
}
.vb-q7m__meta b {
color: var(--q7m-sub);
font-family: var(--q7m-font);
font-weight: 700;
}

@media (max-width: 480px) {
.vb-q7m { padding: 24px 12px; }
.vb-q7m__card { padding: 18px; border-radius: 20px; }
.vb-q7m__cover { border-radius: 12px; margin-bottom: 16px; }
.vb-q7m__vol { width: 80px; }
.vb-q7m__head { padding: 0; }
.vb-q7m__status { font-size: 11px; }
}

@media (min-width: 1200px) {
.vb-q7m { padding: 80px 20px; }
}

@media (prefers-reduced-motion: reduce) {
.vb-q7m[data-state="playing"] .vb-q7m__cover-eq span,
.vb-q7m[data-state="playing"] .vb-q7m__signal span,
.vb-q7m[data-state="playing"] .vb-q7m__bar-fill,
.vb-q7m[data-state="playing"] .vb-q7m__cover-bg,
.vb-q7m[data-state="loading"] .vb-q7m__spin,
.vb-q7m__cover-dot {
animation: none !important;
}
.vb-q7m[data-state="playing"] .vb-q7m__cover-eq span { height: 36px; }
.vb-q7m[data-state="loading"] .vb-q7m__status-dot { animation: none !important; }
}
</style>
</head>
<body>

<section class="vb-q7m" id="vb-q7m-player" data-section-name="Радио-плеер" aria-labelledby="vb-q7m-title" data-vibeblock-unique-section="yes">
<div class="vb-q7m__container">
<header class="vb-q7m__head">

<path d="M3.24 6.15C2.51 6.43 2 7.17 2 8v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2H8.3l8.26-3.34L15.88 1 3.24 6.15zM7 20c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm13-8h-2v-2h-2v2H4V8h16v4z" fill="currentColor"/>

<script>
(function () {
var section = document.getElementById("vb-q7m-player");
if (!section) return;

var audio = section.querySelector("audio");
var playBtn = section.querySelector('[data-action="play"]');
var muteBtn = section.querySelector('[data-action="mute"]');
var volInput = section.querySelector(".vb-q7m__vol-input");
var volFill = section.querySelector(".vb-q7m__vol-fill");
var volBox = section.querySelector(".vb-q7m__vol");
var statusText = section.querySelector(".vb-q7m__status-text");

var STREAM_URLS = [
"http://198.18.0.1:8000/stream",
"http://198.18.0.1:8000/;stream.mp3",
"http://198.18.0.1:8000/stream.mp3",
"http://198.18.0.1:8000/listen.m3u",
"http://198.18.0.1:8000/listen.pls",
"http://198.18.0.1:8000/"
 ];

var STATUS = {
idle: "Готов",
loading: "Подключение…",
playing: "В эфире",
paused: "Пауза",
error: "Нет сигнала"
};

var currentIdx = 0;
var volBeforeMute = 75;
var lastErrorAt = 0;

function setState(s) {
section.setAttribute("data-state", s);
if (statusText) statusText.textContent = STATUS[s] || STATUS.idle;
if (playBtn) {
var playing = s === "playing";
playBtn.setAttribute("aria-pressed", playing ? "true" : "false");
playBtn.setAttribute("aria-label", playing ? "Пауза" : "Воспроизвести");
}
}

function setSrc(idx) {
if (idx >= STREAM_URLS.length) {
setState("error");
return;
}
currentIdx = idx;
try {
audio.src = STREAM_URLS[idx];
audio.load();
} catch (e) {}
}

function play() {
setState("loading");
var p;
try { p = audio.play(); } catch (e) { p = null; }
if (p && typeof p.catch === "function") {
p.catch(function () {});
}
}

function pause() {
try { audio.pause(); } catch (e) {}
if (section.getAttribute("data-state") === "playing") setState("paused");
}

function setVolume(v) {
v = Math.max(0, Math.min(100, v | 0));
audio.volume = v / 100;
volInput.value = String(v);
volFill.style.width = v + "%";
section.setAttribute("data-volume", v === 0 ? "0" : "1");
if (v > 0) volBeforeMute = v;
}

setState("idle");
setVolume(75);
setSrc(0);

playBtn.addEventListener("click", function () {
var s = section.getAttribute("data-state");
if (s === "playing") {
pause();
} else {
if (s === "error") setSrc(0);
play();
}
});

audio.addEventListener("playing", function () {
setState("playing");
lastErrorAt = 0;
});

audio.addEventListener("waiting", function () {
if (section.getAttribute("data-state") === "playing") return;
setState("loading");
});

audio.addEventListener("stalled", function () {
if (section.getAttribute("data-state") === "playing") setState("loading");
});

audio.addEventListener("pause", function () {
if (section.getAttribute("data-state") === "playing") setState("paused");
});

audio.addEventListener("error", function () {
var now = Date.now();
if (now - lastErrorAt < 400) return;
lastErrorAt = now;
setTimeout(function () { setSrc(currentIdx + 1); }, 250);
});

volInput.addEventListener("input", function () {
setVolume(parseInt(this.value, 10) || 0);
});

muteBtn.addEventListener("click", function () {
if (audio.volume > 0) setVolume(0);
else setVolume(volBeforeMute || 75);
});

if (volBox) {
volBox.addEventListener("click", function (e) {
if (e.target === volInput) return;
var rect = volBox.getBoundingClientRect();
var pct = Math.round(((e.clientX - rect.left) / rect.width) * 100);
setVolume(pct);
});
}

section.addEventListener("keydown", function (e) {
if (e.target === volInput) return;
if (e.key === " " || e.key === "Spacebar") {
e.preventDefault();
playBtn.click();
}
});
})();
</script>
</body>
</html>
